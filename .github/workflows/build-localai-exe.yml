name: Build LocalAI.exe

on:
  push:
    paths:
      - "LocalAI/**"
      - ".github/workflows/build-localai-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build
        working-directory: LocalAI
        run: python -m PyInstaller --noconfirm --onefile --windowed --name LocalAI LocalAI.py
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAI-windows
          path: LocalAI/dist/LocalAI.exe
