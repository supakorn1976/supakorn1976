name: Build LocalAI.exe

on:
  push:
    paths:
      - "LocalAI/**"
      - ".github/workflows/build-localai-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller and pypdf
        run: python -m pip install pyinstaller pypdf
      - name: Windows smoke test (clipboard, drag and drop)
        run: python LocalAI/tests/smoke_windows.py
      - name: Build
        working-directory: LocalAI
        run: python -m PyInstaller --noconfirm --onefile --windowed --name LocalAI LocalAI.py
      - name: Check the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath LocalAI/dist/LocalAI.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "LocalAI.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "LocalAI.exe started OK"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAI-windows
          path: LocalAI/dist/LocalAI.exe
