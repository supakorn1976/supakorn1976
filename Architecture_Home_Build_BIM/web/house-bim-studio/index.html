:root{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}

.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.plist{display:flex;flex-direction:column;gap:4px}
.pitem{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 10px;border:1px solid transparent;border-radius:var(--r);background:none;cursor:pointer;min-width:0}
.pitem:hover{background:var(--sunk)}
.pitem.on{border-color:var(--accent);background:var(--accent-soft)}
.pitem small{color:var(--muted);font-size:11.5px}
.pitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 11px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.pitem:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.note{font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}

.kpi{padding:8px 12px;border-right:1px solid var(--line2);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding-inline:20px;background:var(--surface);border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.work{padding-block:18px;padding-inline:20px;display:flex;flex-direction:column;gap:16px;min-width:0}

.scroll{overflow-x:auto;max-width:100%}

td input.w{width:52px}
td input.t{width:120px;text-align:left}
.basis{color:var(--muted);font-size:12px;max-width:420px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.crit{color:var(--crit);border-color:var(--crit)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 16px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--sunk);min-width:0}
textarea.json{width:100%;min-height:420px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--sunk);white-space:pre;overflow:auto}
.err{color:var(--crit);font-size:13px;white-space:pre-wrap}
.viewer{position:relative;height:min(68vh,640px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--scene)}
.viewer canvas{display:block;width:100%;height:100%}
.vtools{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.vtools label{display:flex;gap:5px;align-items:center;font-size:13px;cursor:pointer}
.info{position:absolute;right:10px;top:10px;max-width:min(340px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:12.5px}
.info h4{margin:0 0 6px;font-size:14px}

.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.checks td:last-child{white-space:nowrap}
.hide{display:none!important}

<script id="rb-template" type="text/plain"># encoding: utf-8
# =============================================================================
#  TYPE03_House_BIM.rb  -  บ้านโอบกอด TYPE03 (ธอส.)  โมเดล BIM ครบชุด (SketchUp Ruby)  v2.0

#  โครงสร้าง : เสาเข็ม ฐานราก เสา คาน พื้น PS/S1 บันได โครงหลังคาเหล็ก (#COUNT_S# ชิ้น)
#  สถาปัตย์  : ผนัง P1/P2/P3 เจาะช่องเปิด ประตู D1-D5 หน้าต่าง AW1-AW4 บล็อกช่องลม AW5/AW6
#              ระแนงไม้ วัสดุพื้น F2/F3/F4 ฝ้า C1/C2 หลังคา R1/R2 ครอบสัน
#  งานระบบ   : สุขภัณฑ์ ท่อระบาย บ่อพัก ถังบำบัด ดวงโคม ตู้ไฟ (LOD 100-200)
#  รวม #COUNT# องค์ประกอบ  ทุกชิ้นเป็น Group: IFC 2x3 classification + attribute 'T03_BIM' + Tag
#
#  วิธีใช้ (Window > Ruby Console):
#      load 'C:/path/TYPE03_House_BIM.rb'
#      Type03BIM.build                     # สร้างโมเดลทั้งหลัง (ลบของเดิมที่สคริปต์นี้สร้างก่อน)
#      Type03BIM.build(only: [:structure]) # :structure / :architecture / :mep  เลือกบางหมวด
#      Type03BIM.report                    # ปริมาณงาน + ตารางประตูหน้าต่าง
#      Type03BIM.export_csv('C:/temp/type03')   # เขียน _qto.csv และ _schedule.csv
#      Type03BIM.clashes                   # ตรวจชนกัน (bounding box, ไม่รวมรอยต่อโครงสร้าง)
#      Type03BIM.show(:structure)          # :structure / :architecture / :mep / :all
#  ส่งออก IFC: File > Export > 3D Model > IFC (SketchUp Pro) — ใช้ classification ที่สคริปต์ใส่ให้
#
#  หน่วย = เมตร ; X: แกน 1..4 = 0, 6, 11, 15 ; Y: แถว E..A = 0, 2, 6, 10, 12 (A อยู่ด้านบนของผัง)
#  Z: ดิน ±0.00 ; FFL ห้อง +0.70 ; ห้องน้ำ +0.65 ; เฉลียง +0.60 ; สัน R1 +5.55 ; สัน R2 +4.76
#  ค่าที่สมมติ (ไม่มีในแบบ) ระบุไว้ใน attribute 'Note' ของแต่ละชิ้น
# =============================================================================
module Type03BIM
  NAME   = 'TYPE03 House BIM'
  SCHEMA = 'IFC 2x3'
  # name => [r, g, b, alpha]
  MATS = {
    'concrete'=>[196,194,188,1.0], 'concrete_dark'=>[150,148,142,1.0], 'steel'=>[70,110,150,1.0],
    'wall_ext'=>[236,230,216,1.0], 'wall_int'=>[245,242,235,1.0], 'wall_bath'=>[200,215,220,1.0],
    'wood'=>[140,95,60,1.0], 'glass'=>[150,200,190,0.35], 'breeze'=>[240,238,232,1.0],
    'tile_floor'=>[222,218,210,1.0], 'tile_bath'=>[190,205,210,1.0], 'deck'=>[160,120,85,1.0],
    'ceiling'=>[250,250,248,1.0], 'roof'=>[120,120,118,1.0], 'roof_clear'=>[210,230,235,0.45],
    'sanitary'=>[252,252,252,1.0], 'pipe'=>[90,90,90,1.0], 'light'=>[255,240,170,1.0],
    'panel'=>[60,60,60,1.0], 'ground'=>[150,175,120,1.0],
    'lean'=>[170,168,160,1.0], 'riprap'=>[128,118,104,1.0], 'gravel'=>[188,176,150,1.0], 'earth'=>[176,150,110,0.35], 'lining'=>[205,203,196,1.0]
  }
  STOREYS = { 'FND'=>'Foundation & drainage (below ±0.00)', 'GF'=>'Ground floor (FFL +0.70)', 'ROOF'=>'Roof' }
  DISC = { structure: /\A[SC]-/, architecture: /\AA-/, mep: /\A[PE]-/ }

  # [ifc, name, mark, level, tag, parts, attrs]
  #  part: [:box, x0,x1,y0,y1,z0,z1, mat] | [:poly, [[x,y,z]..], [nx,ny,nz], thick, mat] | [:bar, p1, p2, b, h, mat]
  DATA = [
#DATA#
  ]

  # ---------------------------------------------------------------- helpers
  def self.pt(a); Geom::Point3d.new(a[0].to_f.m, a[1].to_f.m, a[2].to_f.m); end

  def self.material(model, key)
    name = "T03_#{key}"
    mt = model.materials[name]
    return mt if mt
    mt = model.materials.add(name)
    r, g, b, a = MATS[key] || [200,200,200,1.0]
    mt.color = Sketchup::Color.new(r, g, b)
    mt.alpha = a if a < 1.0
    mt
  end

  def self.tag(model, name); model.layers[name] || model.layers.add(name); end

  # face -> solid, extruded along 'dir'; sign taken from the face normal, never guessed
  def self.extrude(ents, pts, dir, len)
    f = ents.add_face(pts)
    f.reverse! if f.normal.dot(dir) < 0
    f.pushpull(len.m)
    f
  end

  def self.build_part(ents, part)
    case part[0]
    when :box
      _, x0, x1, y0, y1, z0, z1, _m = part
      pts = [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]].map { |p| pt(p) }
      extrude(ents, pts, Geom::Vector3d.new(0,0,1), z1 - z0)
    when :poly
      _, pts, n, t, _m = part
      extrude(ents, pts.map { |p| pt(p) }, Geom::Vector3d.new(*n), t)
    when :bar
      _, p1, p2, b, h, _m = part
      u = Geom::Vector3d.new(p2[0]-p1[0], p2[1]-p1[1], p2[2]-p1[2])
      len = u.length.to_f                  # metres (vector built from raw metre numbers)
      u = u.normalize
      side = u.cross(Geom::Vector3d.new(0,0,1))
      side = Geom::Vector3d.new(1,0,0) if side.length < 1e-6
      side = side.normalize
      up = side.cross(u).normalize
      up = up.reverse if up.z < 0
      c = pt(p1)
      pts = [[-1,-1],[1,-1],[1,1],[-1,1]].map { |sx, sy| c.offset(side, sx*b.m/2).offset(up, sy*h.m/2) }
      extrude(ents, pts, u, len)
    end
  end

  def self.ifc_ready?(model)
    return @ifc_ok unless @ifc_ok.nil?
    @ifc_ok = begin
      cl = model.classifications
      unless cl[SCHEMA]
        file = Sketchup.find_support_file("#{SCHEMA}.skc", 'Classifications')
        cl.load_schema(file) if file
      end
      !cl[SCHEMA].nil?
    rescue StandardError
      false
    end
  end

  def self.classify(model, grp, ifc)
    return unless ifc_ready?(model)
    grp.definition.add_classification(SCHEMA, ifc)
  rescue StandardError
    nil
  end

  def self.volume(part)
    case part[0]
    when :box then (part[2]-part[1]) * (part[4]-part[3]) * (part[6]-part[5])
    when :bar then Math.sqrt((0..2).sum { |i| (part[2][i]-part[1][i])**2 }) * part[3] * part[4]
    when :poly
      pts, n, t = part[1], part[2], part[3]
      s = [0.0, 0.0, 0.0]
      pts.each_with_index do |a, i|
        b = pts[(i+1) % pts.size]
        s[0] += a[1]*b[2] - a[2]*b[1]; s[1] += a[2]*b[0] - a[0]*b[2]; s[2] += a[0]*b[1] - a[1]*b[0]
      end
      nl = Math.sqrt(n.sum { |v| v*v })
      ((s[0]*n[0] + s[1]*n[1] + s[2]*n[2]).abs / nl / 2.0) * t
    end
  end

  def self.selected(row, only)
    return true if only.nil?
    Array(only).any? { |d| row[4] =~ DISC[d] }
  end

  # ---------------------------------------------------------------- build
  def self.build(only: nil)
    model = Sketchup.active_model
    model.start_operation('Build TYPE03 BIM', true)
    clear_existing(model)
    root = model.active_entities.add_group
    root.name = NAME
    root.set_attribute('T03_ROOT', 'built', true)
    classify(model, root, 'IfcBuilding')
    storeys = {}
    STOREYS.each do |k, label|
      s = root.entities.add_group
      s.name = label
      classify(model, s, 'IfcBuildingStorey')
      storeys[k] = s
    end
    n = 0
    DATA.each do |row|
      next unless selected(row, only)
      ifc, name, mark, lvl, tagname, parts, attrs = row
      host = storeys[lvl] || storeys['GF']
      g = host.entities.add_group
      if parts.size == 1
        build_part(g.entities, parts[0])
        g.material = material(model, parts[0].last)
      else
        parts.each do |p|
          sub = g.entities.add_group
          build_part(sub.entities, p)
          sub.material = material(model, p.last)
          sub.layer = tag(model, tagname)
        end
      end
      g.name = name
      g.layer = tag(model, tagname)
      classify(model, g, ifc)
      g.set_attribute('T03_BIM', 'IfcClass', ifc)
      g.set_attribute('T03_BIM', 'Mark', mark)
      g.set_attribute('T03_BIM', 'Level', lvl)
      attrs.each { |k, v| g.set_attribute('T03_BIM', k, v) }
      g.set_attribute('T03_BIM', 'Volume_m3', parts.sum { |p| volume(p) }.round(4))
      n += 1
    end
    make_scenes(model)
    model.commit_operation
    puts "#{NAME}: built #{n} elements (IFC classification #{ifc_ready?(model) ? 'ON' : 'OFF - schema not found'})"
    n
  end

  def self.clear_existing(model)
    model.active_entities.grep(Sketchup::Group).each do |g|
      g.erase! if g.valid? && g.get_attribute('T03_ROOT', 'built')
    end
  end

  def self.make_scenes(model)
    return unless model.respond_to?(:pages) && model.pages
    [['01 Structure', :structure], ['02 Architecture', :architecture], ['03 MEP', :mep], ['04 All', :all]].each do |nm, w|
      show(w)
      pg = model.pages[nm]
      pg ? pg.update : model.pages.add(nm)
    end
    show(:all)
  rescue StandardError => e
    puts "scenes skipped: #{e.message}"
  end

  def self.show(what = :all)
    model = Sketchup.active_model
    model.layers.each do |l|
      next unless l.name =~ /\A[SAPEC]-|\ASite\z/
      l.visible = case what
                  when :all then true
                  when :structure then l.name.start_with?('S-', 'C-') || l.name == 'Site'
                  when :architecture then !l.name.start_with?('P-', 'E-')
                  when :mep then l.name.start_with?('P-', 'E-', 'S-Column', 'S-Foundation') || l.name == 'A-Floor'
                  else true
                  end
    end
  end

  # ---------------------------------------------------------------- quantities / schedules
  STEEL_KGM = { 'PRIMARY'=>7.06, 'RIDGE'=>7.06, 'EAVE'=>7.06, 'RAFTER'=>7.20, 'DECK-RAFTER'=>7.20,
                'PURLIN'=>3.45, 'DECK-I'=>14.0, 'DECK-I-NS'=>14.0 }

  def self.qto
    rows = Hash.new { |h, k| h[k] = { count: 0, vol: 0.0, area: 0.0, len: 0.0, kg: 0.0 } }
    DATA.each do |ifc, name, mark, lvl, tagname, parts, attrs|
      r = rows[[tagname, ifc.sub('Ifc', ''), mark]]
      r[:count] += 1
      r[:vol] += parts.sum { |p| volume(p) }
      r[:area] += (attrs['NetArea_m2(one face)'] || attrs['Area_m2'] || attrs['SlopeArea_m2'] || 0).to_f
      if parts[0][0] == :bar
        l = parts.sum { |p| Math.sqrt((0..2).sum { |i| (p[2][i]-p[1][i])**2 }) }
        r[:len] += l
        r[:kg] += l * (STEEL_KGM[mark] || 0)
      end
    end
    rows
  end

  def self.schedule
    DATA.select { |r| %w[IfcDoor IfcWindow].include?(r[0]) }.map do |ifc, name, mark, lvl, tg, parts, a|
      [mark, name, ifc.sub('Ifc', ''), a['Size_WxH_m'], a['Leaves'], a['Description'], a['SillFromFloor_m']]
    end.sort
  end

  def self.report
    puts '%-14s %-24s %-12s %5s %9s %9s %8s %8s' % %w[Tag Class Mark Count Vol_m3 Area_m2 Len_m kg]
    qto.sort.each do |(t, c, m), r|
      puts '%-14s %-24s %-12s %5d %9.2f %9.2f %8.1f %8.0f' % [t, c, m, r[:count], r[:vol], r[:area], r[:len], r[:kg]]
    end
    conc = DATA.select { |r| r[4] =~ /\AS-(Foundation|Column|Beam|Slab|Stair)/ }.sum { |r| r[5].sum { |p| volume(p) } }
    puts 'RC concrete incl. piles: %.2f m3 ; roof steel: %.0f kg' % [conc, qto.values.sum { |r| r[:kg] }]
    puts "\nDOOR / WINDOW SCHEDULE"
    schedule.each { |r| puts r.map(&:to_s).join(' | ') }
    nil
  end

  def self.export_csv(prefix)
    File.open("#{prefix}_qto.csv", 'w:UTF-8') do |f|
      f.puts "\uFEFFTag,Class,Mark,Count,Volume_m3,Area_m2,Length_m,Steel_kg"
      qto.sort.each { |(t, c, m), r| f.puts [t, c, m, r[:count], r[:vol].round(3), r[:area].round(2), r[:len].round(2), r[:kg].round(1)].join(',') }
    end
    File.open("#{prefix}_schedule.csv", 'w:UTF-8') do |f|
      f.puts "\uFEFFMark,Name,Class,Size_WxH_m,Leaves,Description,Sill_m"
      schedule.each { |r| f.puts r.map { |v| v.to_s.include?(',') ? "\"#{v}\"" : v.to_s }.join(',') }
    end
    puts "wrote #{prefix}_qto.csv and #{prefix}_schedule.csv"
  end

  # ---------------------------------------------------------------- clash check (part bounding boxes)
  def self.part_bbox(p)
    case p[0]
    when :box then [p[1], p[2], p[3], p[4], p[5], p[6]]
    when :poly
      pts = p[1]; n = p[2]; t = p[3]; nl = Math.sqrt(n.sum { |v| v*v })
      all = pts + pts.map { |q| (0..2).map { |i| q[i] + n[i]/nl*t } }
      (0..2).flat_map { |i| [all.map { |q| q[i] }.min, all.map { |q| q[i] }.max] }
    when :bar
      a, b, w, h = p[1], p[2], p[3], p[4]; r = [w, h].max / 2.0
      (0..2).flat_map { |i| [[a[i], b[i]].min - r, [a[i], b[i]].max + r] }
    end
  end

  def self.clashes(tol = 0.005)
    items = []
    DATA.each_with_index do |r, i|
      next if r[4].start_with?('S-') || r[4] == 'Site' || r[4] == 'P-Drainage' || r[4] == 'A-Roof'
      r[5].each { |p| items << [i, part_bbox(p)] }
    end
    struct = []
    DATA.each_with_index do |r, i|
      next unless r[4] =~ /\AS-(Column|Beam|Slab|Stair)/
      r[5].each { |p| struct << [i, part_bbox(p)] }
    end
    found = Hash.new(0)
    ov = ->(a, b) { (0..2).all? { |k| [a[2*k+1], b[2*k+1]].min - [a[2*k], b[2*k]].max > tol } }
    items.each_with_index do |(i, a), n|
      items[(n+1)..-1].each { |(j, b)| found[[DATA[i][1], DATA[j][1]]] += 1 if i != j && ov.(a, b) }
      struct.each { |(j, b)| found[[DATA[i][1], DATA[j][1]]] += 1 if ov.(a, b) }
    end
    puts "#{found.size} bbox overlaps between architecture/MEP and structure (sloped-roof bboxes excluded)"
    found.first(80).each { |k, v| puts "  #{k[0]}  x  #{k[1]}" }
    found
  end
end

puts "TYPE03 BIM script loaded (#{Type03BIM::DATA.size} elements). Run: Type03BIM.build"

<script>/* House BIM engine: spec -> elements -> takeoff -> BOQ -> schedule/CPM -> S-curve ; clash check ; SketchUp Ruby export.
   Units: metres. Pure functions, no DOM. */
(function (root) {
'use strict';
const KG = { RB6: 0.222, RB9: 0.499, DB12: 0.888, DB16: 1.578, DB20: 2.466 };
const r4 = v => Math.round(v * 1e4) / 1e4;
const g = v => String(r4(v));                    // python "{:g}" for our values
const ceilx = x => Math.ceil(x - 1e-9);
const SMAT = { IfcPile: 'concrete_dark', IfcFooting: 'concrete_dark', IfcColumn: 'concrete', IfcBeam: 'concrete', IfcSlab: 'concrete', IfcStair: 'concrete' };
const STAG = { IfcPile: 'S-Foundation', IfcFooting: 'S-Foundation', IfcColumn: 'S-Column', IfcBeam: 'S-Beam', IfcSlab: 'S-Slab', IfcStair: 'S-Stair', IfcMember: 'S-RoofSteel' };

// ------------------------------------------------------------------ roofs
function gableFn(gb) {
  const s = (gb.ridgeZ - gb.eaveZ) / gb.eaveDX;
  return x => gb.ridgeZ - s * Math.abs(x - gb.ridgeX);
}
function deckFn(d) {
  const t = Math.tan(d.deg * Math.PI / 180);
  return x => d.z0 - t * Math.min(x - d.xa, d.xb - x);
}

// ------------------------------------------------------------------ generate
function generate(spec) {
  const E = [];
  const add = (ifc, name, mark, level, tag, parts, attrs) => E.push({ ifc, name, mark, level, tag, parts, attrs: attrs || {} });
  const L = spec.levels, F = spec.foundation, C = spec.columns, RS = spec.roofStack;
  const GX = spec.grid.x, GY = spec.grid.y;
  const gables = (spec.roofs.gables || []).map(gb => Object.assign({}, gb, { z: gableFn(gb) }));
  const gByTag = {}; gables.forEach(gb => gByTag[gb.tag] = gb);
  const dzP = -RS.purlin - RS.rafter - RS.primary / 2, dzR = -RS.purlin - RS.rafter / 2, dzU = -RS.purlin / 2 - (RS.purlinDrop || 0);
  const sbox = (ifc, name, mark, level, b, attrs) => add(ifc, name, mark, level, STAG[ifc], [['B', b[0], b[1], b[2], b[3], b[4], b[5], SMAT[ifc]]], attrs);

  // foundations + lower columns
  const fh = F.footing.h, fb = F.footing.b / 2, ps = F.pile.size / 2, lo = C.lower.size / 2;
  for (const [c, x] of Object.entries(GX)) for (const [r, y] of Object.entries(GY)) {
    const n = r + c;
    sbox('IfcPile', 'PILE-' + n, F.pile.mark, 'FND', [x - ps, x + ps, y - ps, y + ps, L.footingTop - fh - F.pile.length + F.pile.embed, L.footingTop - fh + F.pile.embed],
      { Section: F.pile.mark, SafeLoad_t: F.pile.safeLoad_t, Length_m: F.pile.length });
    sbox('IfcFooting', F.footing.mark + '-' + n, F.footing.mark, 'FND', [x - fb, x + fb, y - fb, y + fb, L.footingTop - fh, L.footingTop],
      { Size: `${F.footing.b}x${F.footing.b}x${fh}` });
    sbox('IfcColumn', 'C1L-' + n, 'C1', 'GF', [x - lo, x + lo, y - lo, y + lo, L.footingTop, L.beamTop], { Section: `${C.lower.size}x${C.lower.size}`, Bars: `${C.lower.bars}-${C.lower.bar}` });
  }
  // upper columns: top = underside of the gable primary frame that sits on it, else override
  const up = C.upper.size / 2;
  for (const [c, x] of Object.entries(GX)) for (const [r, y] of Object.entries(GY)) {
    let top = (C.topOverride || {})[r + c];
    if (top == null) {
      const gb = gables.find(q => x >= q.xL - 1e-9 && x <= q.xR + 1e-9 && q.frames.some(f => Math.abs(f - y) < 1e-6));
      top = gb ? gb.z(x) + dzP - RS.primary / 2 : L.beamTop + 2.8;
    }
    sbox('IfcColumn', `C1U-${r}${c}`, 'C1', 'GF', [x - up, x + up, y - up, y + up, L.beamTop, Math.round(top * 1000) / 1000], { Section: `${C.upper.size}x${C.upper.size}`, Bars: `${C.upper.bars}-${C.upper.bar}` });
  }
  // beams
  for (const [mark, axis, line, a, b, name] of spec.beams) {
    const s = spec.beamSections[mark];
    const bb = axis === 'x' ? [a, b, line - s.b / 2, line + s.b / 2] : [line - s.b / 2, line + s.b / 2, a, b];
    sbox('IfcBeam', name, mark, 'GF', [...bb, L.beamTop - s.d, L.beamTop], { Section: `${s.b.toFixed(2)}x${s.d.toFixed(2)}`, 'Bars(top/bot)': s.bars, Stirrup: s.stirrup });
  }
  for (const [mark, name, x0, x1, y0, y1, z0, z1] of spec.slabs)
    sbox('IfcSlab', name, mark, 'GF', [x0, x1, y0, y1, z0, z1], { Type: mark === 'PS' ? 'Precast plank + topping' : 'RC slab' });
  for (const st of spec.stairs) spec.stairLevels.forEach((top, i) => {
    const ya = st.edge + st.dir * spec.stairTread * i, yb = st.edge + st.dir * spec.stairTread * (i + 1);
    sbox('IfcStair', `${st.name}-step${i + 1}`, 'ST-1', 'GF', [st.x0, st.x1, Math.min(ya, yb), Math.max(ya, yb), Math.max(top - 0.30, 0), top], { Riser: 0.15, Tread: spec.stairTread });
  });
  // roof steel
  const bar = (name, ifc, mark, p1, p2, b, h, attrs) => add(ifc, name, mark, 'ROOF', 'S-RoofSteel', [['R', p1.map(r4), p2.map(r4), b, h, 'steel']], attrs);
  for (const gb of gables) {
    const z = gb.z, RHS = { Section: 'RHS 150x50x2.3' };
    for (const y of gb.frames) for (const [a, b] of [[gb.xL, gb.ridgeX], [gb.ridgeX, gb.xR]])
      bar(`${gb.tag}-PRI-y${g(y)}-${a === gb.xL ? 'L' : 'R'}`, 'IfcBeam', 'PRIMARY', [a, y, z(a) + dzP], [b, y, z(b) + dzP], 0.05, RS.primary, RHS);
    bar(`${gb.tag}-RIDGE`, 'IfcMember', 'RIDGE', [gb.ridgeX, gb.y0, z(gb.ridgeX) + dzP], [gb.ridgeX, gb.y1, z(gb.ridgeX) + dzP], 0.05, RS.primary, RHS);
    for (const xe of gb.eaveLines) bar(`${gb.tag}-EAVE-x${g(xe)}`, 'IfcMember', 'EAVE', [xe, gb.y0, z(xe) + dzP], [xe, gb.y1, z(xe) + dzP], 0.05, RS.primary, RHS);
    for (let y = gb.y0; y <= gb.y1 + 1e-9; y += RS.spacing) {
      if (gb.frames.some(f => Math.abs(f - y) < 1e-6)) continue;
      for (const [a, b] of [[gb.xL, gb.ridgeX], [gb.ridgeX, gb.xR]])
        bar(`${gb.tag}-RAF-y${g(y)}-${a === gb.xL ? 'L' : 'R'}`, 'IfcMember', 'RAFTER', [a, y, z(a) + dzR], [b, y, z(b) + dzR], 0.05, RS.rafter, { Section: 'RHS 100x50x3.2 @1.00' });
    }
    const px = [];
    for (let x = gb.ridgeX; x > gb.xL + 1e-9; x -= RS.spacing) px.push(x);
    px.push(gb.xL);
    for (let x = gb.ridgeX + RS.spacing; x < gb.xR - 1e-9; x += RS.spacing) px.push(x);
    px.push(gb.xR);
    [...new Set(px.map(r4))].sort((a, b) => a - b).forEach(x =>
      bar(`${gb.tag}-PUR-x${g(x)}`, 'IfcMember', 'PURLIN', [x, gb.y0, z(x) + dzU], [x, gb.y1, z(x) + dzU], 0.05, RS.purlin, { Section: 'RHS 50x50x2.3 @1.00' }));
  }
  const D = spec.roofs.deck;
  if (D) {
    const zd = deckFn(D), H = 0.075, IB = { Section: 'I 150x75x5.5x9.5' };
    for (const [y, a, b, name] of D.ew) bar(name, 'IfcBeam', 'DECK-I', [a, y, zd(a) - H], [b, y, zd(b) - H], 0.075, 0.15, IB);
    for (const [x, y0, y1] of D.ns) bar(`DK-NS-x${g(x)}`, 'IfcBeam', 'DECK-I-NS', [x, y0, zd(x) - H - D.nsDrop], [x, y1, zd(x) - H - D.nsDrop], 0.075, 0.15, IB);
    for (const [y, a, b] of D.rafters) bar(`DK-RAF-y${g(y)}-${g(a)}`, 'IfcMember', 'DECK-RAFTER', [a, y, zd(a) - 0.075 - 0.05], [b, y, zd(b) - 0.075 - 0.05], 0.05, RS.rafter, { Section: 'RHS 100x50x3.2 @1.00' });
  }

  // ---------------- walls + openings
  const T = spec.wallT, FFL = L.ffl;
  const unitMap = spec.units;
  const topOf = (w) => {
    if (typeof w.top === 'number') return { f: () => w.top };
    if (String(w.top).startsWith('roof:')) {
      const gb = gByTag[w.top.slice(5)];
      if (w.axis === 'y') { const v = gb.z(w.c) - 0.30; return { f: () => v }; }
      return { f: s => gb.z(s) - 0.30, ridge: w.ridge ? gb.ridgeX : null };
    }
    const v = L[w.top]; return { f: () => v };
  };
  const DOORSPEC = { Frame: 'Hardwood 2"x4", sash 4"x1-1/2"', Hardware: 'HAFELE or equal', Finish: 'Wood oil stain' };
  for (const w of spec.walls) {
    const tp = topOf(w), tf = tp.f, ridge = tp.ridge, zb = spec.wallBase, c = w.c;
    const mat = { P2: 'wall_int', P3: 'wall_bath' }[w.mark] || 'wall_ext';
    const ops = [];
    for (const o of w.openings || []) {
      if (o.void) { ops.push([o.a, o.b, o.zs, o.zh, null]); continue; }
      const u = unitMap[o.unit];
      let a = o.a, b = o.b;
      if (o.c != null) { a = r4(o.c - u.w / 2); b = r4(o.c + u.w / 2); }
      const floor = o.floor != null ? o.floor : FFL;
      const zs = u.kind === 'door' ? FFL : floor + u.sill, zh = zs + u.h;
      ops.push([a, b, zs, zh, Object.assign({ unitMark: o.unit, name: o.name || o.unit, ua: o.c != null ? o.c - u.w / 2 : a, ub: o.c != null ? o.c + u.w / 2 : b }, u)]);
    }
    ops.sort((p, q) => p[0] - q[0]);
    const prism = (s0, s1, za, zf) => {
      const prof = [[s0, za], [s1, za], [s1, zf(s1)]];
      if (ridge != null && s0 + 1e-6 < ridge && ridge < s1 - 1e-6) prof.push([ridge, zf(ridge)]);
      prof.push([s0, zf(s0)]);
      const pts = prof.map(([s, z]) => (w.axis === 'x' ? [s, c - T / 2, z] : [c - T / 2, s, z]).map(r4));
      return ['P', pts, w.axis === 'x' ? [0, 1, 0] : [1, 0, 0], T, mat];
    };
    const segArea = (s0, s1, za, zf) => {
      const xs = [s0, s1]; if (ridge != null && s0 < ridge && ridge < s1) xs.push(ridge); xs.sort((p, q) => p - q);
      let A = 0; for (let i = 0; i < xs.length - 1; i++) A += (xs[i + 1] - xs[i]) * ((zf(xs[i]) + zf(xs[i + 1])) / 2 - za); return A;
    };
    const parts = []; let cur = w.a, area = 0;
    for (const [o0, o1, zs, zh] of ops) {
      if (o0 > cur + 1e-6) { parts.push(prism(cur, o0, zb, tf)); area += segArea(cur, o0, zb, tf); }
      if (zs > zb + 1e-3) { parts.push(prism(o0, o1, zb, () => zs)); area += (o1 - o0) * (zs - zb); }
      parts.push(prism(o0, o1, zh, tf)); area += segArea(o0, o1, zh, tf);
      cur = o1;
    }
    if (w.b > cur + 1e-6) { parts.push(prism(cur, w.b, zb, tf)); area += segArea(cur, w.b, zb, tf); }
    const at = { Type: w.mark, Thickness_m: T, 'NetArea_m2(one face)': Math.round(area * 100) / 100, Spec: { P1: 'AAC Q-CON Extra Cool 7.5 cm, exterior paint', P2: 'AAC Q-CON Extra Cool 7.5 cm, interior paint', P3: 'Brick + plaster, glazed tile finish' }[w.mark] || w.mark };
    if (w.note) at.Note = w.note;
    add('IfcWall', w.id, w.mark, 'GF', 'A-Wall', parts, at);
    // door / window units
    for (const [, , zs, zh, u] of ops) {
      if (!u) continue;
      const a = u.ua, b = u.ub, f = 0.05, lt = 0.03, win = u.kind === 'window';
      const box = (s0, s1, za, zz, d0, d1, m) => w.axis === 'x' ? ['B', s0, s1, c + d0, c + d1, za, zz, m] : ['B', c + d0, c + d1, s0, s1, za, zz, m];
      const P = [box(a, a + f, zs, zh, -T / 2, T / 2, 'wood'), box(b - f, b, zs, zh, -T / 2, T / 2, 'wood'), box(a + f, b - f, zh - f, zh, -T / 2, T / 2, 'wood')];
      const zlo = zs + (win ? f : 0);
      if (win) P.push(box(a + f, b - f, zs, zs + f, -T / 2, T / 2, 'wood'));
      const n = u.leaves, lw = (b - a - 2 * f) / n, leaf = win ? 'glass' : u.leaf;
      for (let i = 0; i < n; i++) {

const MATC = {concrete:[196,194,188,1],concrete_dark:[150,148,142,1],steel:[70,110,150,1],wall_ext:[236,230,216,1],wall_int:[245,242,235,1],wall_bath:[200,215,220,1],wood:[140,95,60,1],glass:[150,200,190,.35],breeze:[240,238,232,1],tile_floor:[222,218,210,1],tile_bath:[190,205,210,1],deck:[160,120,85,1],ceiling:[250,250,248,1],roof:[120,120,118,1],roof_clear:[210,230,235,.45],sanitary:[252,252,252,1],pipe:[90,90,90,1],light:[255,240,170,1],panel:[60,60,60,1],ground:[150,175,120,1],lean:[170,168,160,1],riprap:[128,118,104,1],gravel:[188,176,150,1],earth:[176,150,110,.3],lining:[205,203,196,1]};
const V3 = { renderer:null, scene:null, camera:null, controls:null, groups:{}, meshes:[], hidden:new Set(['Site','A-Ceiling']), box:null, raf:null, host:null };
function prismOf(p){
  if (p[0] === 'B') { const [,x0,x1,y0,y1,z0,z1] = p; return { base:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]], d:[0,0,z1-z0] }; }
  if (p[0] === 'P') { const n = p[2], l = Math.hypot(...n); return { base:p[1], d:n.map(v => v/l*p[3]) }; }
  const V = H.partVerts(p); return { base:[V[0],V[1],V[3],V[2]], d:[V[4][0]-V[0][0], V[4][1]-V[0][1], V[4][2]-V[0][2]] };
}
function pushPrism(arr, col, pr, c){
  const B = pr.base, T = B.map(q => [q[0]+pr.d[0], q[1]+pr.d[1], q[2]+pr.d[2]]), tri = (a,b,cc) => { arr.push(...a,...b,...cc); col.push(...c,...c,...c); };
  for (let i = 1; i < B.length - 1; i++) { tri(B[0], B[i+1], B[i]); tri(T[0], T[i], T[i+1]); }
  for (let i = 0; i < B.length; i++) { const j = (i+1) % B.length; tri(B[i], B[j], T[j]); tri(B[i], T[j], T[i]); }
}
function buildScene(){
  const THREE = window.THREE; if (!THREE || !V3.scene) return;

  V3.groups = {}; V3.meshes = [];
  const lineMat = new THREE.LineBasicMaterial({ color: 0x2a2f2d, transparent: true, opacity: 0.28 });
  S.R.E.forEach((e, idx) => {
    const op = { v:[], c:[] }, tr = { v:[], c:[] };
    for (const p of e.parts) { const m = MATC[p[p.length-1]] || [200,200,200,1]; pushPrism(m[3] < 1 ? tr.v : op.v, m[3] < 1 ? tr.c : op.c, prismOf(p), [m[0]/255, m[1]/255, m[2]/255]); }
    const grp = V3.groups[e.tag] || (V3.groups[e.tag] = new THREE.Group());
    for (const [buf, transp] of [[op,false],[tr,true]]) {
      if (!buf.v.length) continue;
      const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(buf.v, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(buf.c, 3)); geo.computeVertexNormals();
      const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, transparent: transp, opacity: transp ? 0.4 : 1, depthWrite: !transp });
      const mesh = new THREE.Mesh(geo, mat); mesh.userData.idx = idx; grp.add(mesh); V3.meshes.push(mesh);
      if (!transp && e.parts.length < 60) { const ln = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), lineMat); grp.add(ln); }
    }

  for (const [t, g] of Object.entries(V3.groups)) { g.visible = !V3.hidden.has(t); V3.scene.add(g); }
  V3.viewVer = S.geomVer; select(null);
}
function initViewer(host){
  const THREE = window.THREE;
  if (!THREE || !THREE.OrbitControls) { host.innerHTML = '<div class="empty">โหลดตัวแสดงผล 3D ไม่ได้ (three.js)</div>'; return; }
  if (!V3.renderer) {
    V3.renderer = new THREE.WebGLRenderer({ antialias: true }); V3.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));

    const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(-20, -30, 40); V3.scene.add(dl);

function sizeViewer(){ if (!V3.host || !V3.renderer) return; const r = V3.host.getBoundingClientRect(); if (!r.width) return; V3.renderer.setSize(r.width, r.height, false); V3.camera.aspect = r.width / r.height; V3.camera.updateProjectionMatrix(); }

function doExport(kind){
  const fn = (S.name || 'house').replace(/[^\w\u0E00-\u0E7F-]+/g, '_').slice(0, 60), R = S.R;
  if (kind === 'json') return offer(fn + '.json', JSON.stringify(Object.assign(clone(S.spec), { name: S.name }), null, 1));
  if (kind === 'rb') return offer(fn + '_BIM.rb.txt', H.rubyScript(Object.assign({}, S.spec, { name: S.name }), R.E, RBT));
  if (kind === 'csv') { const rows = [['key','description','unit','qty','basis']].concat(Object.values(R.TO.Q).map(q => [q.key, q.desc, q.unit, q.qty, q.basis]));
    return offer(fn + '_takeoff.csv', '\uFEFF' + rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v).join(',')).join('\n')); }
  if (kind === 'xlsx') { const X = window.XLSX; if (!X) return alertBox('โหลดไลบรารี Excel ไม่ได้'); return offer(fn + '_BOQ_Plan.xlsx', buildXlsx(X, R)); }
}

    ['งวด','สิ้นสัปดาห์ที่','วันที่','สะสม %','มูลค่าสะสม'], ...milestones(SC).map(m => ['งวดที่ ' + m.k, m.week, m.date, m.pct, m.cum])], [34,16,16,16,12]);
  // BOQ with live formulas for qty and money

  const fr = [];
  B.cats.forEach(c => { aoa.push([c.title]); c.subs.forEach(sb => { aoa.push(['', sb.title]); const r0 = aoa.length + 1;
    sb.rows.forEach(r => { const i = aoa.length + 1; aoa.push([r.no, r.desc, r.unit, r.base, r.waste/100, r.qty, r.rMat, r.rLab, r.mat, r.lab, r.total, r.act, r.cat, r.note]); fr.push(i); });
    aoa.push(['', 'รวม ' + sb.title, '', '', '', '', '', '', sb.mat, sb.lab, sb.total]); fr.push(['sum', aoa.length, r0, aoa.length - 1]); }); });
  aoa.push([], ['', 'รวมต้นทุนตรง', '', '', '', '', '', '', B.mat, B.lab, B.direct], ['', 'Factor F', '', '', '', '', '', '', '', '', B.F], ['', 'ราคารวม', '', '', '', '', '', '', '', '', B.total]);
  add('BOQ', aoa, [8,52,7,12,7,12,11,11,13,13,14,8,6,50], ws => {
    for (const f of fr) {
      if (Array.isArray(f)) { const [, r, a, b] = f; for (const col of ['I','J','K']) ws[col + r] = { t:'n', v: ws[col + r].v, f: `SUM(${col}${a}:${col}${b})` }; continue; }
      ws['F' + f].f = `D${f}*(1+E${f})`; ws['I' + f].f = `F${f}*G${f}`; ws['J' + f].f = `F${f}*H${f}`; ws['K' + f].f = `I${f}+J${f}`; ws['E' + f].z = '0%';

    ...SC.acts.map(a => [a.id, a.name, a.qty, a.ref.prod, a.ref.crews, a.ref.fixed, a.weather, a.dur, a.preds.map(([p,l]) => p+':'+l).join(', '), a.stISO, a.finISO, a.float, a.critical ? 'วิกฤต' : '', a.direct, a.value, ...Object.keys(SC.catTot).map(c => a.byCat[c] || 0)])], [6,44,10,9,6,8,6,8,18,11,11,7,7,13,13,12,12,12,12]);

    ...SC.W.map(r => [r.week, r.ws, r.we, ...cats.map(c => r.byCat[c]), r.value, r.cum, r.pct, ...cats.map(c => r.cumCatPct[c])])], [8,11,11,13,13,13,13,13,14,10,12,12,12,12]);
  return X.write(wb, { type: 'array', bookType: 'xlsx' });
}

// ---------------------------------------------------------------- events
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-open],[data-view],[data-act],[data-show],[data-exp]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; try { localStorage.setItem('hbs.tab', S.tab); } catch (e) {} renderTab(); return; }
  if (t.dataset.open) { openProject(t.dataset.open); return; }
  if (t.dataset.view) { setView(t.dataset.view); return; }
  if (t.dataset.exp) { doExport(t.dataset.exp); return; }
  if (t.dataset.show != null) { S.tab = 'model'; S.sel = Number(t.dataset.show); renderTab(); return; }
  const a = t.dataset.act;
  if (a === 'unsel') select(null);
  if (a === 'clash') { t.disabled = true; t.textContent = 'กำลังตรวจ…'; setTimeout(() => { S.clash = H.clashes(S.R.E); renderTop(); renderTab(); }, 20); }
  if (a === 'applyjson') {
    let sp; try { sp = JSON.parse($('#json').value); H.run(sp); } catch (e) { $('#jsonerr').textContent = 'ใช้ไม่ได้: ' + (e.message || e); return; }
    S.spec = sp; if (sp.name) { S.name = sp.name; $('#pname').value = S.name; } touch(); }
  if (a === 'resetjson') renderTab();
  if (a === 'hol') { S.spec.plan.holidays = $('#q_hol').value.split(/\s+/).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x)); touch(false); }
});
document.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset;
  if (d.tag != null) { t.checked ? V3.hidden.delete(d.tag) : V3.hidden.add(d.tag); if (V3.groups[d.tag]) V3.groups[d.tag].visible = t.checked; return; }
  if (d.q) { let v = t.value; if (d.t === 'num' || d.t === 'seln') v = Number(v); if (d.t === 'bool') v = v === '1'; if ((d.t === 'num' || d.t === 'seln') && isNaN(v)) return;
    if (d.t === 'auto') { v = v.trim().toLowerCase(); if (v === '' || v === 'auto') v = 'auto'; else { v = Number(v); if (!(v > 0)) return; } } setPath(S.spec, d.q, v); touch(!/^plan|^meta/.test(d.q)); return; }
  if (d.wx != null) { S.spec.plan.weather[Number(d.wx)] = Math.min(0.9, Math.max(0, Number(t.value) / 100)); touch(false); return; }
  if (d.mq) { S.spec.manualQty[d.mq].qty = Number(t.value) || 0; touch(false); return; }
  if (d.boq) { const [ci, si, ii, f] = d.boq.split('.'); const it = S.spec.boq[ci].subs[si].items[ii]; it[f] = f === 'act' ? t.value.trim() : Number(t.value) || 0; touch(false); return; }
  if (d.actE) { const [i, f] = d.actE.split('.'); const a = S.spec.activities[Number(i)];
    if (f === 'preds') a.preds = t.value.split(',').map(x => x.trim()).filter(Boolean).map(x => { const [p, l] = x.split(':'); return [p.trim(), Number(l || 0)]; });
    else a[f] = t.value === '' ? null : Number(t.value);
    touch(false); return; }
  if (t.id === 'jump') { const ta = $('#json'), i = ta.value.indexOf('"' + t.value + '"'); if (i >= 0) { ta.focus(); ta.setSelectionRange(i, i); const lines = ta.value.slice(0, i).split('\n').length; ta.scrollTop = (lines - 3) * 16; } return; }
});
$('#pname').addEventListener('change', e => { S.name = e.target.value.trim() || 'โครงการ'; S.dirty = true; scheduleSave(); renderProjects(); });
$('#bSave').addEventListener('click', save);
for (const b of ['#bNew', '#bNewC']) $(b).addEventListener('click', ev => { const T = TEMPLATES[ev.currentTarget.dataset.tpl]; S.spec = clone(T); S.id = null; S.name = T.name + ' (สำเนาใหม่)'; S.dirty = true; S.sel = null; $('#pname').value = S.name; renderProjects(); recompute(); setStatus(); });
$('#bDup').addEventListener('click', () => { S.id = null; S.name = S.name + ' (สำเนา)'; S.dirty = true; $('#pname').value = S.name; renderProjects(); setStatus(); });
$('#bDel').addEventListener('click', async ev => {
  const b = ev.currentTarget; if (!S.db || !S.id) return;
  if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'กดอีกครั้งเพื่อยืนยันการลบ'; setTimeout(() => { b.dataset.armed = ''; b.textContent = 'ลบ'; }, 4000); return; }
  b.dataset.armed = ''; b.textContent = 'ลบ';
  await S.db.doc('projects/' + S.id).delete(); S.id = null; S.dirty = true; setStatus(); renderProjects();
});
$('#fImport').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { const sp = JSON.parse(rd.result); H.run(sp); S.spec = sp; S.id = null; S.name = sp.name || f.name.replace(/\.json$/,''); $('#pname').value = S.name; S.dirty = true; recompute(); setStatus(); renderProjects(); } catch (e) { alertBox('นำเข้าไม่ได้: ' + (e.message || e)); } };
  rd.readAsText(f); ev.target.value = '';
});

$('#pname').value = S.name;
recompute(); setStatus(); renderProjects();
})();
</script>

</body></html>
